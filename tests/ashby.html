<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>JobPilot Ashby verification</title><link rel="stylesheet" href="/styles.css"></head><body><main class="profile-form"><h1>Ashby compatibility checks</h1><p>Local fixture only. No employer receives this test.</p><button id="run" type="button">Run Ashby checks</button><pre id="results">Not run</pre><div role="tabpanel" id="application-panel"><div class="ashby-application-form-autofill-pane"><label>Autofill from resume<input type="file" id="generic-upload"></label></div><div class="ashby-application-form-container"><div class="ashby-application-form-field-entry"><label for="name">Name*</label><input id="name" required></div><div class="ashby-application-form-field-entry" data-field-path="_systemfield_location"><label class="_required_fixture">Where are you located?</label><input role="combobox" aria-expanded="false"></div><div class="ashby-application-form-field-entry"><label for="email">Email*</label><input id="email" type="email" required></div><div class="ashby-application-form-field-entry"><label for="intro">Tell us a bit about yourself</label><textarea id="intro"></textarea></div><div class="ashby-application-form-field-entry" data-field-path="_systemfield_resume"><label for="resume" class="_required_fixture">Resume</label><input id="resume" type="file" accept=".pdf" required></div></div><button id="submit" class="ashby-application-form-submit-button">Submit Application</button></div><form><label>Email<input name="newsletter_email" type="email"></label><button>Subscribe</button></form></main><script type="module" src="/tests/ashby-harness.js"></script></body></html>
