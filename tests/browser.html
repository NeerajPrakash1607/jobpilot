<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>JobPilot autofill verification</title><link rel="stylesheet" href="/styles.css"></head><body><main class="profile-form"><h1>Autofill verification</h1><p>This isolated fixture never submits to an employer.</p><button id="run-tests" type="button">Run autofill checks</button><button id="run-submission-tests" type="button">Run submission checks</button><pre id="submission-results">Not run</pre><pre id="results">Not run</pre><form id="fixture"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Email<input type="email" required></label><label>Phone<input type="tel"></label><label>LinkedIn URL<input name="linkedin"></label><label>Portfolio URL<input name="portfolio"></label><label>Current company<input name="current_company" value="Keep existing answer"></label><label>Work authorization<input name="work_authorization" required></label><label>Expected salary<input name="salary" required></label><label>Résumé<input type="file" name="resume" accept=".pdf" required></label><label>Cover letter<textarea name="cover_letter"></textarea></label><label>Consent<input type="checkbox" required></label><button type="submit">Submit application</button></form><form id="newsletter"><label>Email<input type="email" name="newsletter_email"></label><button type="submit">Subscribe</button></form></main><script type="module" src="/tests/browser-harness.js"></script></body></html>
